<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spring Oscillator</title>
<style>
body {
    font-family: sans-serif;
    margin: 20px;
}
canvas {
    border: 1px solid black;
}
.controls {
    margin-bottom: 20px;
}
</style>
</head>
<body>

<h1>Spring Oscillator (Euler Method)</h1>

<div class="controls">
    k:
    <input type="range" id="k" min="0.1" max="10" step="0.1" value="1">
    <span id="kValue">1</span>
</div>

<canvas id="plot" width="800" height="400"></canvas>

<script>

const canvas = document.getElementById("plot");
const ctx = canvas.getContext("2d");

const kSlider = document.getElementById("k");
const kValue = document.getElementById("kValue");

function simulate() {

    const k = Number(kSlider.value);
    const m = 1.0;

    const dt = 0.05;
    const tMax = 20;

    let x = 1.0;
    let v = 0.0;

    const data = [];

    for (let t = 0; t <= tMax; t += dt) {

        data.push({t,x});

        const a = -(k/m) * x;

        v = v + a * dt;
        x = x + v * dt;
    }

    draw(data);
}

function draw(data) {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const xs = data.map(p => p.x);

    const xmin = Math.min(...xs);
    const xmax = Math.max(...xs);

    ctx.beginPath();

    data.forEach((p,i) => {

        const px =
            i/(data.length-1) * canvas.width;

        const py =
            canvas.height -
            ((p.x - xmin)/(xmax - xmin))
            * canvas.height;

        if(i===0)
            ctx.moveTo(px,py);
        else
            ctx.lineTo(px,py);
    });

    ctx.stroke();
}

kSlider.addEventListener("input", () => {
    kValue.textContent = kSlider.value;
    simulate();
});

simulate();

</script>
</body>
</html>
