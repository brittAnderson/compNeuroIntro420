<div style="text-align: center; font-family: sans-serif; margin: 20px auto; max-width: 520px;">
  <h3>Perceptron Decision Boundary & Dot Product Explorer</h3>
  <p style="font-size: 14px; color: #555;">Click and drag anywhere on the canvas to move input vector <strong>x</strong> around weight vector <strong>w</strong>. Code by Gemini 2026-11-09 </p>
  
  <canvas id="vectorCanvas" width="500" height="500" style="border: 1px solid #ccc; background: #fafafa; cursor: pointer;"></canvas>
  
  <div id="stats" style="margin-top: 10px; font-size: 15px; font-family: monospace;">
    Angle: <span id="valAngle">0°</span> | 
    Cos(θ): <span id="valCos">0.00</span> | 
    Dot Product: <span id="valDot" style="font-weight: bold;">0.00</span>
  </div>
</div>

<script>
const canvas = document.getElementById('vectorCanvas');
const ctx = canvas.getContext('2d');

// Center of canvas in cartesian space
const cx = 250;
const cy = 250;
const scale = 50; // pixels per unit

// Fixed weight vector w
let w = { x: 2.0, y: 1.5 };
// Movable input vector x
let x = { x: 1.5, y: -2.0 };

let isDragging = false;

function toCanvasCoords(vx, vy) {
  return { x: cx + vx * scale, y: cy - vy * scale };
}

function fromCanvasCoords(px, py) {
  return { x: (px - cx) / scale, y: (cy - py) / scale };
}

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Axes
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
  ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
  ctx.stroke();
}

function drawArrow(fromX, fromY, toX, toY, color, label) {
  const headlen = 10;
  const angle = Math.atan2(toY - fromY, toX - fromX);
  
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 3;
  
  // Line
  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(toX, toY);
  ctx.stroke();
  
  // Arrowhead
  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
  ctx.lineTo(toX, toY);
  ctx.fill();
  
  // Label
  if (label) {
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(label, toX + 10, toY - 10);
  }
}

function update() {
  drawGrid();
  
  let wC = toCanvasCoords(w.x, w.y);
  let xC = toCanvasCoords(x.x, x.y);
  
  // 1. Draw Decision Boundary (Perpendicular line to w: w1*x1 + w2*x2 = 0)
  // Normal vector to w is (-w.y, w.x)
  let lenW = Math.hypot(w.x, w.y);
  if (lenW > 0) {
    let nx = -w.y / lenW;
    let ny = w.x / lenW;
    let p1 = toCanvasCoords(nx * 10, ny * 10);
    let p2 = toCanvasCoords(-nx * 10, -ny * 10);
    
    ctx.strokeStyle = '#9ca3af';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.setLineDash([]); // reset
  }
  
  // 2. Draw vectors
  drawArrow(cx, cy, wC.x, wC.y, '#2563eb', 'w');
  drawArrow(cx, cy, xC.x, xC.y, '#dc2626', 'x');
  
  // 3. Calculations
  let dot = w.x * x.x + w.y * x.y;
  let lenX = Math.hypot(x.x, x.y);
  let cosTheta = (lenW > 0 && lenX > 0) ? dot / (lenW * lenX) : 0;
  cosTheta = Math.max(-1, Math.min(1, cosTheta));
  let angleRad = Math.acos(cosTheta);
  let angleDeg = angleRad * (180 / Math.PI);
  
  // Update text stats
  document.getElementById('valAngle').innerText = angleDeg.toFixed(1) + '°';
  document.getElementById('valCos').innerText = cosTheta.toFixed(2);
  let dotEl = document.getElementById('valDot');
  dotEl.innerText = dot.toFixed(2);
  dotEl.style.color = dot >= 0 ? '#15803d' : '#dc2626';
}

canvas.addEventListener('mousedown', (e) => { isDragging = true; handleMove(e); });
window.addEventListener('mouseup', () => { isDragging = false; });
canvas.addEventListener('mousemove', (e) => { if (isDragging) handleMove(e); });

function handleMove(e) {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  let coords = fromCanvasCoords(mouseX, mouseY);
  x.x = coords.x;
  x.y = coords.y;
  update();
}

// Initial draw
update();
</script>
